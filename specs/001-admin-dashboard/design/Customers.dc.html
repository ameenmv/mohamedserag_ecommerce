<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<title>العملاء والتجّار</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@400;500;600;700&family=Lalezar&family=Outfit:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>body { margin: 0; }</style>
</helmet>

<div style="box-sizing:border-box;width:100%;font-family:'IBM Plex Sans Arabic',system-ui,sans-serif;color:#14201A;padding:28px 32px 56px;display:flex;flex-direction:column;gap:20px">

  <div style="box-sizing:border-box;display:flex;flex-wrap:wrap;gap:12px;align-items:center;justify-content:space-between">
    <div style="box-sizing:border-box;display:flex;background:#fff;border:1px solid #E1DAC0;border-radius:999px;padding:5px;gap:2px">
      <button class="chip" onClick="{{tabTraders}}" style="box-sizing:border-box;height:42px;padding:0 22px;border:none;border-radius:999px;font-weight:700;font-size:15px;background:{{tBg}};color:{{tFg}}">طلبات التجّار <span style="box-sizing:border-box;font-family:'Outfit',sans-serif;margin-inline-start:6px;font-size:13px;background:#E4572E;color:#fff;border-radius:999px;padding:2px 8px">{{pending}}</span></button>
      <button class="chip" onClick="{{tabCustomers}}" style="box-sizing:border-box;height:42px;padding:0 22px;border:none;border-radius:999px;font-weight:700;font-size:15px;background:{{cBg}};color:{{cFg}}">كل العملاء</button>
    </div>
    <label style="box-sizing:border-box;flex:0 1 300px;height:44px;border-radius:999px;background:#fff;border:1px solid #E1DAC0;display:flex;align-items:center;gap:10px;padding:0 16px;color:#7A857E">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><circle cx="11" cy="11" r="7"></circle><path d="M20 20l-3.5-3.5"></path></svg>
      <input value="{{q}}" onChange="{{setQ}}" placeholder="ابحث بالاسم أو اسم الشركة" aria-label="بحث" style="box-sizing:border-box;flex:1;min-width:0;border:none;background:transparent;font-size:14.5px;color:#14201A">
    </label>
  </div>

  <sc-if value="{{isTraders}}" hint-placeholder-val="{{ true }}">
    <div style="box-sizing:border-box;display:grid;grid-template-columns:repeat(auto-fit,minmax(340px,1fr));gap:18px">
      <sc-for list="{{reqs}}" as="r" hint-placeholder-count="4">
        <div class="card" style="box-sizing:border-box;background:#fff;border:1px solid #E7E0C8;border-radius:28px;padding:24px;display:flex;flex-direction:column;gap:16px">
          <div style="box-sizing:border-box;display:flex;justify-content:space-between;align-items:flex-start;gap:10px">
            <div style="box-sizing:border-box;display:flex;gap:14px;align-items:center;min-width:0">
              <span style="box-sizing:border-box;width:56px;height:56px;border-radius:18px;background:#2A4D38;color:#D2C27A;font-family:'Lalezar',sans-serif;font-size:28px;display:flex;align-items:center;justify-content:center;flex:none;padding-bottom:4px">{{r.initial}}</span>
              <span style="box-sizing:border-box;display:flex;flex-direction:column;gap:3px;min-width:0"><span style="box-sizing:border-box;font-weight:700;font-size:17px;line-height:1.4">{{r.company}}</span><span style="box-sizing:border-box;font-size:13.5px;color:#7A857E">{{r.type}} · {{r.city}}</span></span>
            </div>
            <span style="box-sizing:border-box;font-size:12.5px;font-weight:700;padding:5px 12px;border-radius:999px;background:{{r.sbg}};color:{{r.sfg}};flex:none">{{r.statusLabel}}</span>
          </div>
          <div style="box-sizing:border-box;display:grid;grid-template-columns:1fr 1fr;gap:10px;font-size:13.5px">
            <div style="box-sizing:border-box;background:#F4F1E6;border-radius:14px;padding:12px 14px;display:flex;flex-direction:column;gap:3px"><span style="box-sizing:border-box;color:#7A857E">السجل التجاري</span><span style="box-sizing:border-box;font-family:'Outfit',sans-serif;font-weight:700;direction:ltr;text-align:right">{{r.cr}}</span></div>
            <div style="box-sizing:border-box;background:#F4F1E6;border-radius:14px;padding:12px 14px;display:flex;flex-direction:column;gap:3px"><span style="box-sizing:border-box;color:#7A857E">حجم الشراء المتوقع</span><span style="box-sizing:border-box;font-weight:700">{{r.volume}}</span></div>
          </div>
          <sc-if value="{{r.isPending}}" hint-placeholder-val="{{ true }}">
            <div style="box-sizing:border-box;display:flex;flex-direction:column;gap:8px">
              <span style="box-sizing:border-box;font-size:13.5px;font-weight:700;color:#5B665F">الحد الائتماني</span>
              <div style="box-sizing:border-box;display:flex;flex-wrap:wrap;gap:8px">
                <sc-for list="{{r.limits}}" as="l" hint-placeholder-count="3">
                  <button class="chip" onClick="{{l.pick}}" style="box-sizing:border-box;height:38px;padding:0 16px;border-radius:999px;border:1.5px solid {{l.bd}};background:{{l.bg}};color:{{l.fg}};font-family:'Outfit',sans-serif;font-weight:700;font-size:14px">{{l.label}}</button>
                </sc-for>
              </div>
            </div>
            <div style="box-sizing:border-box;display:flex;gap:10px">
              <button class="btn-gold" onClick="{{r.approve}}" style="box-sizing:border-box;flex:1;height:48px;border:none;border-radius:999px;background:#B5A45C;color:#14201A;font-weight:700;font-size:15.5px">اعتماد الحساب</button>
              <button class="btn-line" onClick="{{r.reject}}" style="box-sizing:border-box;flex:0 0 100px;height:48px;border-radius:999px;border:1.5px solid #E4B3A3;background:transparent;color:#A2381A;font-weight:700;font-size:15px">رفض</button>
            </div>
          </sc-if>
          <sc-if value="{{r.isDecided}}" hint-placeholder-val="{{ false }}">
            <div style="box-sizing:border-box;font-size:14px;color:#5B665F;line-height:1.7;border-top:1px dashed #D8D0B4;padding-top:12px">{{r.note}}</div>
          </sc-if>
        </div>
      </sc-for>
    </div>
  </sc-if>

  <sc-if value="{{isCustomers}}" hint-placeholder-val="{{ false }}">
    <div style="box-sizing:border-box;background:#fff;border:1px solid #E7E0C8;border-radius:28px;padding:14px 14px 8px">
      <div style="box-sizing:border-box;overflow-x:auto">
        <div style="box-sizing:border-box;min-width:640px">
          <div style="box-sizing:border-box;display:grid;grid-template-columns:2fr 1fr 1fr 1.2fr 1fr;gap:12px;padding:12px 14px;font-size:12.5px;font-weight:700;color:#7A857E"><span>العميل</span><span>النوع</span><span>الطلبات</span><span>إجمالي المشتريات</span><span>الولاء</span></div>
          <sc-for list="{{customers}}" as="c" hint-placeholder-count="8">
            <div class="row-h" style="box-sizing:border-box;display:grid;grid-template-columns:2fr 1fr 1fr 1.2fr 1fr;gap:12px;align-items:center;padding:14px;border-top:1px solid #F0EAD3;border-radius:14px">
              <span style="box-sizing:border-box;display:flex;align-items:center;gap:12px;min-width:0"><span style="box-sizing:border-box;width:42px;height:42px;border-radius:50%;background:#F1ECDD;color:#2A4D38;font-family:'Lalezar',sans-serif;font-size:21px;display:flex;align-items:center;justify-content:center;flex:none;padding-bottom:3px">{{c.initial}}</span><span style="box-sizing:border-box;display:flex;flex-direction:column;gap:2px;min-width:0"><span style="box-sizing:border-box;font-weight:700;font-size:15px">{{c.name}}</span><span style="box-sizing:border-box;font-size:12.5px;color:#7A857E">{{c.city}}</span></span></span>
              <span style="box-sizing:border-box;font-size:13.5px;color:#3B4A41">{{c.type}}</span>
              <span style="box-sizing:border-box;font-family:'Outfit',sans-serif;font-weight:700">{{c.orders}}</span>
              <span style="box-sizing:border-box;font-family:'Outfit',sans-serif;font-weight:700">{{c.spent}} <span style="box-sizing:border-box;font-family:'IBM Plex Sans Arabic',sans-serif;font-weight:500;font-size:12px;color:#7A857E">ج.م</span></span>
              <span style="box-sizing:border-box;justify-self:start;font-size:12.5px;font-weight:700;padding:5px 12px;border-radius:999px;background:{{c.tbg}};color:{{c.tfg}}">{{c.tier}}</span>
            </div>
          </sc-for>
          <sc-if value="{{noCustomers}}" hint-placeholder-val="{{ false }}"><div style="box-sizing:border-box;padding:60px 10px;text-align:center;color:#7A857E;font-size:15px">مفيش نتائج.</div></sc-if>
        </div>
      </div>
    </div>
  </sc-if>

  <sc-if value="{{toast}}" hint-placeholder-val="{{ false }}">
    <div class="toast" style="box-sizing:border-box;position:fixed;bottom:28px;left:50%;margin-left:-190px;width:380px;max-width:92vw;background:#14201A;color:#FAF7EE;border-radius:18px;padding:16px 20px;font-weight:600;font-size:15px;box-shadow:0 18px 40px rgba(0,0,0,.3);z-index:50">{{toast}}</div>
  </sc-if>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":1176,"height":1200}}'>
class Component extends DCLogic {
  constructor(props) {
    super(props);
    const R = (id, company, type, city, cr, volume) => ({ id, company, type, city, cr, volume, status: 'pending', limit: 100000 });
    this.state = {
      tab: 'traders', q: '', toast: '',
      reqs: [
        R(1, 'شركة النيل للتجهيزات', 'مقاول تجهيزات', 'طنطا', '[رقم السجل]', 'أكتر من 500 ألف / شهر'),
        R(2, 'مكتب الأمل للتوريدات', 'مورد مؤسسات', 'المنصورة', '[رقم السجل]', '100 - 500 ألف / شهر'),
        R(3, 'فنادق البحر الأزرق', 'ضيافة وفنادق', 'دمياط', '[رقم السجل]', 'أكتر من 500 ألف / شهر'),
        R(4, 'معرض الإخلاص للأجهزة', 'تاجر تجزئة', 'ميت غمر', '[رقم السجل]', 'أقل من 100 ألف / شهر')
      ],
      customers: [
        { name: 'أحمد محمود', city: 'المنصورة', type: 'أفراد', orders: 6, spent: 184200, tier: 'ذهبي' },
        { name: 'شركة النيل للتجهيزات', city: 'طنطا', type: 'تاجر', orders: 14, spent: 1250000, tier: 'بلاتيني' },
        { name: 'منى السيد', city: 'دمياط', type: 'أفراد', orders: 3, spent: 62400, tier: 'فضي' },
        { name: 'ياسمين خالد', city: 'الزقازيق', type: 'جهاز عروسة', orders: 2, spent: 214000, tier: 'ذهبي' },
        { name: 'محمد إبراهيم', city: 'المنصورة', type: 'أفراد', orders: 1, spent: 21900, tier: 'جديد' },
        { name: 'مكتب الأمل للتوريدات', city: 'المنصورة', type: 'تاجر', orders: 9, spent: 640000, tier: 'بلاتيني' },
        { name: 'كريم عادل', city: 'ميت غمر', type: 'أفراد', orders: 2, spent: 31900, tier: 'جديد' },
        { name: 'هدى سمير', city: 'المنصورة', type: 'أفراد', orders: 4, spent: 77300, tier: 'فضي' }
      ]
    };
  }
  flash(m) {
    this.setState({ toast: m });
    clearTimeout(this._t);
    this._t = setTimeout(() => this.setState({ toast: '' }), 2400);
  }
  renderVals() {
    const S = this.state;
    const fmt = (n) => n.toLocaleString('en-US');
    const q = S.q.trim();
    const upd = (id, patch) => this.setState({ reqs: S.reqs.map((r) => r.id === id ? { ...r, ...patch } : r) });
    const tier = { 'جديد': ['#F1ECDD', '#5B665F'], 'فضي': ['#E6E9EC', '#454D55'], 'ذهبي': ['#F6EFCB', '#6F6329'], 'بلاتيني': ['#DCE8F5', '#1D4E80'] };
    const st = { pending: ['بانتظار المراجعة', '#F6EFCB', '#6F6329'], approved: ['معتمد', '#E2F1E6', '#1F6B3F'], rejected: ['مرفوض', '#FBE4DC', '#A2381A'] };
    const tr = S.tab === 'traders';
    const cus = S.customers.filter((c) => !q || c.name.indexOf(q) >= 0);
    return {
      pending: S.reqs.filter((r) => r.status === 'pending').length,
      isTraders: tr, isCustomers: !tr,
      tBg: tr ? '#2A4D38' : 'transparent', tFg: tr ? '#FAF7EE' : '#3B4A41',
      cBg: !tr ? '#2A4D38' : 'transparent', cFg: !tr ? '#FAF7EE' : '#3B4A41',
      tabTraders: () => this.setState({ tab: 'traders' }), tabCustomers: () => this.setState({ tab: 'customers' }),
      q: S.q, setQ: (e) => this.setState({ q: e.target.value }),
      reqs: S.reqs.filter((r) => !q || r.company.indexOf(q) >= 0).map((r) => ({
        initial: r.company.charAt(0), company: r.company, type: r.type, city: r.city, cr: r.cr, volume: r.volume,
        statusLabel: st[r.status][0], sbg: st[r.status][1], sfg: st[r.status][2],
        isPending: r.status === 'pending', isDecided: r.status !== 'pending',
        note: r.status === 'approved' ? 'تم اعتماد الحساب بحد ائتماني ' + fmt(r.limit) + ' ج.م وإرسال بيانات الدخول للتاجر.' : 'تم رفض الطلب وإبلاغ المتقدم.',
        limits: [50000, 100000, 250000].map((l) => ({ label: fmt(l), bd: r.limit === l ? '#2A4D38' : '#E1DAC0', bg: r.limit === l ? '#2A4D38' : '#fff', fg: r.limit === l ? '#FAF7EE' : '#3B4A41', pick: () => upd(r.id, { limit: l }) })),
        approve: () => { upd(r.id, { status: 'approved' }); this.flash('اتعتمد حساب ' + r.company); },
        reject: () => { upd(r.id, { status: 'rejected' }); this.flash('اترفض طلب ' + r.company); }
      })),
      customers: cus.map((c) => ({ initial: c.name.charAt(0), name: c.name, city: c.city, type: c.type, orders: c.orders, spent: fmt(c.spent), tier: c.tier, tbg: tier[c.tier][0], tfg: tier[c.tier][1] })),
      noCustomers: cus.length === 0,
      toast: S.toast
    };
  }
}
</script>
</body>
</html>
