name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  # Throwaway values for CI; none of these are real secrets or used in production.
  CI: '1'
  DATABASE_URL: postgresql://serag:serag@localhost:5432/serag
  TEST_DATABASE_URL: postgresql://serag:serag@localhost:5432/serag_test
  API_PORT: 4000
  SESSION_SECRET: ci-dummy-session-secret-for-testing-only-not-used-in-prod
  WEB_ORIGIN: http://localhost:3000
  ADMIN_EMAIL: admin@ci.serag.local
  ADMIN_PASSWORD: ci-admin-password
  ADMIN_NAME: CI Admin
  ALLOW_TEST_SEED: 'true'
  # The dev seed's demo flash sale would change the prices the browser suite expects
  SEED_DEMO_FLASH: 'false'
  # 32+ characters throwaway secret for the test seed endpoint in CI
  TEST_SEED_SECRET: ci-test-seed-secret-must-be-32-chars-long-min
  E2E_TELEMETRY_DISABLED: '1'

jobs:
  checks:
    name: Checks (Lint, Types, Tests, Build, E2E)
    runs-on: ubuntu-latest
    timeout-minutes: 40
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: serag
          POSTGRES_PASSWORD: serag
          POSTGRES_DB: serag
          POSTGRES_INITDB_ARGS: --encoding=UTF8 --locale=C.UTF-8
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U serag"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Create test database
        run: PGPASSWORD=serag psql -h localhost -U serag -d serag -c 'CREATE DATABASE serag_test'

      - name: Build shared package
        run: pnpm --filter @serag/shared build

      - name: Database migrations and client generation
        run: |
          pnpm --filter @serag/api exec prisma migrate deploy
          pnpm --filter @serag/api exec prisma generate

      - name: Seed database
        run: pnpm db:seed

      - name: Lint
        run: pnpm lint

      - name: Typecheck
        run: pnpm typecheck

      - name: Unit tests
        run: pnpm test

      - name: API tests
        run: pnpm --filter @serag/api test:e2e

      - name: Build
        run: pnpm build

      - name: Install chromium for e2e
        run: pnpm --filter @serag/e2e exec e2e-web install chromium --with-deps

      # The production build, not `pnpm dev`: the CSP, compression and lazy hydration only exist there.
      - name: Start production API and web
        env:
          NUXT_API_INTERNAL_BASE: http://localhost:4000/api
          NUXT_PUBLIC_API_BASE: http://localhost:4000/api
          NUXT_PUBLIC_SITE_URL: http://localhost:3000
        run: |
          (cd apps/api && nohup node dist/main.js > /tmp/api.log 2>&1 &)
          (cd apps/web && PORT=3000 nohup node .output/server/index.mjs > /tmp/web.log 2>&1 &)
          for i in $(seq 1 60); do
            curl -fsS http://localhost:4000/api/health > /dev/null && curl -fsS http://localhost:3000/healthz > /dev/null && exit 0
            sleep 1
          done
          echo "servers did not start"; cat /tmp/api.log /tmp/web.log; exit 1

      - name: Browser e2e (production build)
        env:
          CI: '1'
          APP_URL: http://localhost:3000
          API_URL: http://localhost:4000
          ALLOW_TEST_SEED: 'true'
          TEST_SEED_SECRET: ci-test-seed-secret-must-be-32-chars-long-min
        run: pnpm --filter @serag/e2e exec e2e run --reporter list,junit

      # Viewport regression (spec 009, T013): the shopper journeys again at phone widths.
      - name: Browser e2e journeys at 375 and 320 px
        env:
          CI: '1'
          APP_URL: http://localhost:3000
          API_URL: http://localhost:4000
          ALLOW_TEST_SEED: 'true'
          TEST_SEED_SECRET: ci-test-seed-secret-must-be-32-chars-long-min
        run: |
          JOURNEYS="tests/smoke.e2e.ts tests/catalog.e2e.ts tests/search.e2e.ts tests/product.e2e.ts tests/compare-wishlist.e2e.ts tests/checkout-cod.e2e.ts tests/checkout-transfer.e2e.ts tests/coupon.e2e.ts tests/bridal-builder.e2e.ts tests/bridal-reserve.e2e.ts tests/quiz.e2e.ts tests/reviews-submit.e2e.ts tests/notify-me.e2e.ts"
          for vp in 375x812 320x640; do
            echo "::group::viewport $vp"
            # Rate limits are per minute per IP; give each pass a fresh window
            sleep 60
            E2E_VIEWPORT=$vp pnpm --filter @serag/e2e exec e2e run $JOURNEYS
            echo "::endgroup::"
          done

      # A second web server whose browser API base is the Caddy origin, like production: with an item in
      # the cart every page asks /api/cart/quote, which would be a blocked cross-origin call to :4000.
      - name: Start web and Caddy for Lighthouse (HTTP/2 like production)
        if: ${{ !cancelled() }}
        env:
          NUXT_API_INTERNAL_BASE: http://localhost:4000/api
          NUXT_PUBLIC_API_BASE: https://localhost:8443/api
          NUXT_PUBLIC_SITE_URL: https://localhost:8443
        run: |
          (cd apps/web && PORT=3001 nohup node .output/server/index.mjs > /tmp/web-lh.log 2>&1 &)
          docker run -d --name lh-caddy --network host -v "$PWD/docker/Caddyfile.lighthouse:/etc/caddy/Caddyfile:ro" caddy:2
          for i in $(seq 1 60); do
            curl -fsSk https://localhost:8443/healthz > /dev/null && curl -fsSk https://localhost:8443/api/health > /dev/null && exit 0
            sleep 1
          done
          echo "lighthouse servers did not start"; cat /tmp/web-lh.log; docker logs lh-caddy; exit 1

      # Home, a category, a product and checkout against the seeded catalogue (spec 009, T011).
      - name: Lighthouse CI (mobile, four pages)
        if: ${{ !cancelled() }}
        # puppeteer runs lighthouse/add-to-cart.cjs first, so checkout is measured with an item in the cart
        run: pnpm dlx --package @lhci/cli@0.15.1 --package puppeteer@24.10.2 lhci autorun --config=lighthouserc.json

      - name: Upload Lighthouse artifacts
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: lighthouse-report
          path: .lighthouseci/
          include-hidden-files: true
          if-no-files-found: warn
          retention-days: 7

      - name: Server logs on failure
        if: failure()
        run: cat /tmp/api.log /tmp/web.log /tmp/web-lh.log || true

      - name: Upload e2e artifacts
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: e2e-results
          path: |
            tests/e2e/.e2e/report.json
            tests/e2e/.e2e/junit.xml
            tests/e2e/.e2e/results
            tests/e2e/.e2e/logs
          if-no-files-found: warn
          retention-days: 7

  docker:
    name: Docker Build Validation
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      SESSION_SECRET: ci-dummy-session-secret-for-docker-build-verification
      UMAMI_SECRET: ci-dummy-umami-secret-for-docker-build-verification
      TEST_SEED_SECRET: ci-test-seed-secret-must-be-32-chars-long-min
      SITE_ADDRESS: http://localhost
      PUBLIC_URL: http://localhost
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Build Docker images
        run: docker compose -f docker/compose.yml build

      - name: compose-smoke
        env:
          SITE_ADDRESS: http://localhost
          PUBLIC_URL: http://localhost
          TEST_SEED_SECRET: ci-test-seed-secret-must-be-32-chars-long-min
        run: |
          docker compose -f docker/compose.yml -f docker/compose.e2e.yml up -d --wait
          curl -fsS http://localhost/api/health
          curl -fsS http://localhost/ | grep -q 'dir="rtl"'

      - name: Docker compose logs on failure
        if: failure()
        run: docker compose -f docker/compose.yml -f docker/compose.e2e.yml logs

      - name: Tear down Docker compose
        if: always()
        run: docker compose -f docker/compose.yml -f docker/compose.e2e.yml down -v
