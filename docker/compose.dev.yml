# Local development: only the databases. Apps run with `pnpm dev`.
name: serag-dev
services:
  db:
    image: postgres:17
    environment:
      POSTGRES_USER: serag
      POSTGRES_PASSWORD: serag
      POSTGRES_DB: serag
      POSTGRES_INITDB_ARGS: "--encoding=UTF8 --locale=C.UTF-8"
    ports: ["5432:5432"]
    volumes: [db-data:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U serag -d serag"]
      interval: 5s
      retries: 10
  db-test:
    image: postgres:17
    environment:
      POSTGRES_USER: serag
      POSTGRES_PASSWORD: serag
      POSTGRES_DB: serag_test
      POSTGRES_INITDB_ARGS: "--encoding=UTF8 --locale=C.UTF-8"
    ports: ["5433:5432"]
    tmpfs: [/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U serag -d serag_test"]
      interval: 5s
      retries: 10
volumes:
  db-data:
