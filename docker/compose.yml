# Production-like stack: web + api + db + caddy (+ umami analytics).
name: serag
services:
  db:
    image: postgres:17
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-serag}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-serag}
      POSTGRES_DB: serag
      POSTGRES_INITDB_ARGS: "--encoding=UTF8 --locale=C.UTF-8"
    volumes:
      - db-data:/var/lib/postgresql/data
      - ./initdb:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-serag} -d serag"]
      interval: 5s
      retries: 20

  api:
    build: { context: .., dockerfile: docker/api.Dockerfile }
    restart: unless-stopped
    depends_on: { db: { condition: service_healthy } }
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-serag}:${POSTGRES_PASSWORD:-serag}@db:5432/serag
      SESSION_SECRET: ${SESSION_SECRET:?set SESSION_SECRET}
      WEB_ORIGIN: ${PUBLIC_URL:-https://localhost}
      API_PORT: 4000
      UPLOADS_DIR: /uploads
      ALLOW_TEST_SEED: "false"
    volumes: [uploads:/uploads]

  web:
    build: { context: .., dockerfile: docker/web.Dockerfile }
    restart: unless-stopped
    depends_on: [api]
    environment:
      NUXT_API_INTERNAL_BASE: http://api:4000/api
      NUXT_PUBLIC_API_BASE: ${PUBLIC_URL:-https://localhost}/api
      NUXT_PUBLIC_UMAMI_HOST: ${UMAMI_PUBLIC_URL:-}
      NUXT_PUBLIC_UMAMI_WEBSITE_ID: ${UMAMI_WEBSITE_ID:-}
      UPLOADS_DIR: /uploads
    volumes: [uploads:/uploads:ro]

  umami:
    image: ghcr.io/umami-software/umami:postgresql-latest
    restart: unless-stopped
    depends_on: { db: { condition: service_healthy } }
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-serag}:${POSTGRES_PASSWORD:-serag}@db:5432/umami
      APP_SECRET: ${UMAMI_SECRET:-change-me}

  caddy:
    image: caddy:2
    restart: unless-stopped
    depends_on: [web, api]
    ports: ["80:80", "443:443"]
    environment:
      SITE_ADDRESS: ${SITE_ADDRESS:-localhost}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - uploads:/uploads:ro
      - caddy-data:/data

volumes:
  db-data:
  uploads:
  caddy-data:
