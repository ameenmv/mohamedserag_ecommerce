# Production-like stack: web + api + migrate + db + caddy (+ umami analytics).
name: serag
services:
  db:
    image: postgres:17
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-serag}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-serag}
      POSTGRES_DB: serag
      POSTGRES_INITDB_ARGS: "--encoding=UTF8 --locale=C.UTF-8"
    volumes:
      - db-data:/var/lib/postgresql/data
      - ./initdb:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-serag} -d serag"]
      interval: 5s
      retries: 20

  migrate:
    build:
      context: ..
      dockerfile: docker/api.Dockerfile
      target: migrate
    restart: "no"
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-serag}:${POSTGRES_PASSWORD:-serag}@db:5432/serag
      UPLOADS_DIR: /uploads
    volumes:
      - uploads:/uploads

  # Usage: ADMIN_EMAIL=... ADMIN_PASSWORD=... docker compose -f docker/compose.yml --profile tools run --rm seed
  seed:
    profiles: ["tools"]
    build:
      context: ..
      dockerfile: docker/api.Dockerfile
      target: migrate
    restart: "no"
    working_dir: /repo/apps/api
    command: ["pnpm", "exec", "prisma", "db", "seed"]
    depends_on:
      migrate:
        condition: service_completed_successfully
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-serag}:${POSTGRES_PASSWORD:-serag}@db:5432/serag
      UPLOADS_DIR: /uploads
      ADMIN_EMAIL: ${ADMIN_EMAIL:-}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-}
      # No demo orders on a real server (the catalogue, settings and content are still seeded)
      SEED_DEMO_ORDERS: ${SEED_DEMO_ORDERS:-false}
      SEED_DEMO_FLASH: ${SEED_DEMO_FLASH:-false}
    volumes:
      - uploads:/uploads

  api:
    build:
      context: ..
      dockerfile: docker/api.Dockerfile
      target: run
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-serag}:${POSTGRES_PASSWORD:-serag}@db:5432/serag
      SESSION_SECRET: ${SESSION_SECRET:?set SESSION_SECRET}
      WEB_ORIGIN: ${PUBLIC_URL:-https://localhost}
      API_PORT: 4000
      UPLOADS_DIR: /uploads
      ALLOW_TEST_SEED: "false"
    volumes:
      - uploads:/uploads
    healthcheck:
      test: ["CMD-SHELL", "node -e \"fetch('http://localhost:4000/api/health').then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))\""]
      interval: 10s
      timeout: 3s
      retries: 3
      start_period: 10s

  web:
    build:
      context: ..
      dockerfile: docker/web.Dockerfile
      target: run
    restart: unless-stopped
    depends_on:
      api:
        condition: service_healthy
    environment:
      NUXT_API_INTERNAL_BASE: http://api:4000/api
      NUXT_PUBLIC_API_BASE: /api
      NUXT_PUBLIC_UMAMI_HOST: /stats
      NUXT_PUBLIC_UMAMI_WEBSITE_ID: ${UMAMI_WEBSITE_ID:-}
      # Public origin for canonical URLs, hreflang, sitemap, JSON-LD and the CSP https upgrade
      NUXT_PUBLIC_SITE_URL: ${PUBLIC_URL:-https://localhost}
      NUXT_PUBLIC_I18N_BASE_URL: ${PUBLIC_URL:-https://localhost}
      # 'true' only on the real domain; otherwise robots.txt disallows everything
      NUXT_PUBLIC_SITE_INDEXABLE: ${SITE_INDEXABLE:-false}
      UPLOADS_DIR: /uploads
    volumes:
      - uploads:/uploads:ro
    healthcheck:
      test: ["CMD-SHELL", "node -e \"fetch('http://localhost:3000/healthz').then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))\""]
      interval: 10s
      timeout: 3s
      retries: 3
      start_period: 10s

  # Automated daily database and uploads backup.
  # Note: Backups stored on the same disk protect against accidental deletes, bugs,
  # and bad migrations, not host or disk loss. Copying backups off the server
  # to remote storage is documented in docs/OPERATIONS.md.
  backup:
    image: postgres:17
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    entrypoint: ["sh", "/backup/backup.sh"]
    environment:
      PGHOST: db
      PGUSER: ${POSTGRES_USER:-serag}
      PGPASSWORD: ${POSTGRES_PASSWORD:-serag}
      PGDATABASE: serag
      BACKUP_RETENTION_DAYS: ${BACKUP_RETENTION_DAYS:-30}
    volumes:
      - ./backup:/backup:ro
      - uploads:/uploads:ro
      - backups:/backups

  # Note: The Umami dashboard UI does not work under /stats (only the tracker and /api/send do).
  # Dashboard access for now via `docker compose port umami 3000` / SSH tunnel; a subdomain later.
  umami:
    image: ghcr.io/umami-software/umami:postgresql-latest
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-serag}:${POSTGRES_PASSWORD:-serag}@db:5432/umami
      APP_SECRET: ${UMAMI_SECRET:?set UMAMI_SECRET}
      TRACKER_SCRIPT_NAME: script.js
      COLLECT_API_ENDPOINT: /api/send
      DISABLE_TELEMETRY: "1"

  caddy:
    image: caddy:2
    restart: unless-stopped
    depends_on:
      web:
        condition: service_healthy
      api:
        condition: service_healthy
      umami:
        condition: service_started
    ports: ["80:80", "443:443"]
    environment:
      SITE_ADDRESS: ${SITE_ADDRESS:-localhost}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - uploads:/uploads:ro
      - caddy-data:/data

volumes:
  db-data:
  uploads:
  caddy-data:
  backups:
