      <stop offset="0" stop-color="#3D4A23" stop-opacity=".9"/>
      <stop offset="1" stop-color="#0E1A13" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="gold" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#D2C27A"/>
      <stop offset="1" stop-color="#B5A45C"/>
